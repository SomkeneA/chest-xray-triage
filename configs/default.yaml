# Starting point for a real NIH ChestX-ray14 run.
# These hyperparameters are not a tuned result. Train, read MLflow, then change them.
# Run from the repository root.

seed: 42
checkpoint_dir: checkpoints

data:
  csv_path: data/Data_Entry_2017.csv
  image_dir: data/images
  train_ratio: 0.70
  val_ratio: 0.10
  test_ratio: 0.20
  image_size: 224
  batch_size: 32
  num_workers: 4
  # patient: shuffle patients. patient_stratified: same split, balanced on
  # "any finding" versus "No Finding". Both keep a patient in one split.
  split_strategy: patient_stratified
  view_position: null
  max_per_split: null
  drop_missing: true

model:
  name: densenet121
  pretrained: true
  dropout: 0.1

train:
  epochs: 10
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  # auto = n_negative / n_positive on the training split, capped by pos_weight_max.
  # none = plain BCE-with-logits. A list of 14 floats is also accepted.
  pos_weight: auto
  pos_weight_max: 20.0
  early_stopping_patience: 3
  grad_clip: 1.0
  amp: true
  device: auto

mlflow:
  enabled: true
  experiment_name: chest-xray-triage
  tracking_uri: sqlite:///mlruns/mlflow.db

eval:
  # A fixed threshold, or best_f1 to pick one threshold per label on val.
  threshold: 0.5
  ece_bins: 15
  output_dir: outputs/eval
