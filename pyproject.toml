[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-triage"
version = "0.1.0"
description = "Chest X-ray triage and explainability pipeline for NIH ChestX-ray14."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SomkeneA" }]
keywords = ["chest-xray", "pytorch", "densenet", "grad-cam", "medical-imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.110",
    "matplotlib>=3.8",
    "mlflow>=2.11",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchvision>=0.17",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
cxr-train = "cxr_triage.training.train:main"
cxr-eval = "cxr_triage.evaluation.evaluate:main"
cxr-gradcam = "cxr_triage.explainability.gradcam:main"
cxr-download = "cxr_triage.data.download:main"
cxr-serve = "cxr_triage.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies with Query() and File() in argument defaults.
"src/cxr_triage/api/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
